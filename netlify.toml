[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Pulls the latest Axiz Digital price list from their SFTP drop daily at 02:00 UTC
[functions."axiz-sync"]
  schedule = "0 2 * * *"

# Backfills AI-generated product descriptions for Axiz/Pinnacle products
# missing one (their feeds don't include descriptions) — runs after both
# suppliers' daily syncs (Axiz 02:00, Pinnacle pg_cron 01:30) have finished
[functions."generate-descriptions-background"]
  schedule = "0 3 * * *"

# Security headers — applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=63072000; includeSubDomains"
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://firestore.googleapis.com https://generativelanguage.googleapis.com; font-src 'self' data:; frame-ancestors 'none';"

# Long-lived cache for hashed assets (JS, CSS, images built by Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache HTML — users always get the latest version
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
