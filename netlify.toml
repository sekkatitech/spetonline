[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Pulls the latest Axiz Digital price list from their SFTP drop daily at 02:00 UTC
[functions."axiz-sync"]
  schedule = "0 2 * * *"

# Backfills AI-generated product descriptions for Axiz/Pinnacle products
# missing one (their feeds don't include descriptions) — runs after both
# suppliers' daily syncs (Axiz 02:00, Pinnacle pg_cron 01:30) have finished
[functions."generate-descriptions-background"]
  schedule = "0 3 * * *"

# Storefront AI shopping assistant reads the knowledge base at runtime
[functions."claude-chat"]
  included_files = ["knowledge-base.md"]

# Contact form: drafts a suggested reply from the knowledge base
[functions."contact-enquiry"]
  included_files = ["knowledge-base.md"]

# Emails yesterday's visitor summary, written by Claude, at 06:00 SAST
[functions."daily-visitor-report"]
  schedule = "0 4 * * *"

# Cancels storefront orders left unpaid for 48 hours, at 07:00 SAST
[functions."cancel-stale-orders"]
  schedule = "0 5 * * *"

# The Apple reader swaps supplier image URLs for the WebP copies mirrored into Supabase
# Storage (scripts/mirror-apple-images.mjs), so the manifest ships with the function.
[functions."apple-catalogue"]
  included_files = ["netlify/functions/apple-images.json"]

# Security headers — applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security  = "max-age=63072000; includeSubDomains"
    Cross-Origin-Opener-Policy = "same-origin"
    # Scripts only from this site and Mapbox: no inline scripts and no eval, so injected
    # HTML can't run code. Checkout posts its form to PayFast, hence form-action.
    Content-Security-Policy    = "default-src 'self'; script-src 'self' https://api.mapbox.com; worker-src 'self' blob:; child-src blob:; style-src 'self' 'unsafe-inline' https://api.mapbox.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; media-src 'self' https://core.co.za; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.mapbox.com https://events.mapbox.com; font-src 'self' data: https://api.mapbox.com https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; form-action 'self' https://www.payfast.co.za https://sandbox.payfast.co.za; frame-ancestors 'none'; upgrade-insecure-requests"

# Long-lived cache for hashed assets (JS, CSS, images built by Vite)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache HTML — users always get the latest version
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
